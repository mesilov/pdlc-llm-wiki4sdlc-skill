  <rect class="work" x="226" y="257" width="195" height="12"/>
  <text x="32" y="309">Требования</text>
  <rect class="work" x="276" y="297" width="217" height="12"/>
  <text x="32" y="349">Проектирование</text>
  <rect class="work" x="414" y="337" width="181" height="12"/>
  <text x="32" y="389">Разработка</text>
  <rect class="work" x="523" y="377" width="188" height="12"/>
  <text x="32" y="429">Тестирование</text>
  <rect class="work" x="494" y="417" width="304" height="12"/>
  <text x="32" y="469">Развёртывание</text>
  <rect class="work" x="696" y="457" width="94" height="12"/>
  <text x="32" y="509">Сопровождение</text>
  <rect class="work" x="769" y="497" width="159" height="12"/>

  <text class="heading" x="32" y="590">Validation</text>
  <rect x="204" y="558" width="724" height="52" fill="#ececee"/>
