<svg xmlns="http://www.w3.org/2000/svg" width="960" height="1140" viewBox="0 0 960 1140" role="img" aria-labelledby="title description">
  <title id="title">PDLC, SDLC и семь линз знаний</title>
  <desc id="description">Условная линия времени одного продуктового изменения. Discovery включает Ideation; далее идут Definition, Design, Development, Launch и Optimization. Работы SDLC перекрываются и затрагивают несколько этапов PDLC. Validation и семь тематических линз доступны весь цикл. Длительности и границы иллюстративные. Обратная связь запускает следующую итерацию.</desc>
  <style>
    text { font-family: Arial, Helvetica, sans-serif; font-size: 18px; fill: #262626; }
    .title { font-size: 26px; font-weight: 500; }
    .heading { font-size: 20px; font-weight: 500; }
    .small { font-size: 16px; }
    .phase { text-anchor: middle; font-size: 16px; }
    .grid { stroke: #e5e5e5; stroke-width: 1; }
    .work { fill: #808080; }
  </style>
  <rect width="960" height="1140" fill="#ffffff"/>
  <text class="title" x="32" y="48">PDLC, SDLC и семь линз знаний</text>

  <text class="heading" x="32" y="95">Один цикл</text>
  <text class="small" x="204" y="95">Начало</text>
  <text class="small" x="928" y="95" text-anchor="end">Время →</text>
  <path class="grid" d="M204 105H928"/>

  <text class="heading" x="32" y="140">PDLC</text>
  <text class="small" x="32" y="165">Фокус продукта</text>
